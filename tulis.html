<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulis Pesan dan Kesan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #ffe3ea;
    font-family: system-ui, sans-serif;
    overflow-x: hidden;
    animation: in 2s ease both;
  }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }

  /* Hati melayang di belakang */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .hearts span {
    position: absolute;
    bottom: -40px;
    color: #ff2d4d;
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    10%  { opacity: .45; }
    100% { transform: translateY(-115vh) scale(1.1); opacity: 0; }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 56px 22px 70px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    text-align: center;
  }
  .kicker {
    margin: 0;
    font-size: .75rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #ff8fa3;
    opacity: .8;
  }
  h1 {
    margin: 6px 0 0;
    font-family: "Great Vibes", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: clamp(2.6rem, 14vw, 4rem);
    line-height: 1.1;
    text-shadow: 0 0 10px rgba(255, 60, 90, .8),
                 0 0 32px rgba(255, 30, 60, .5);
  }
  .intro {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    line-height: 1.6;
    color: #ffd6e0;
  }

  .card {
    padding: 26px 22px 24px;
    text-align: left;
    background: linear-gradient(160deg, rgba(40, 0, 10, .92), rgba(10, 0, 3, .92));
    border: 1px solid rgba(255, 60, 90, .4);
    border-radius: 20px;
    box-shadow: 0 0 28px rgba(255, 30, 60, .22),
                inset 0 0 18px rgba(255, 30, 60, .06);
  }
  label {
    display: block;
    margin: 0 0 8px;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #ff6b85;
  }
  .field + .field { margin-top: 22px; }
  textarea {
    width: 100%;
    min-height: 130px;
    padding: 14px 16px;
    resize: vertical;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.6;
    color: #ffe3ea;
    background: rgba(0, 0, 0, .45);
    border: 1px solid rgba(255, 60, 90, .35);
    border-radius: 14px;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
  }
  textarea::placeholder { color: rgba(255, 190, 205, .4); font-style: italic; }
  textarea:focus {
    border-color: rgba(255, 90, 120, .9);
    box-shadow: 0 0 14px rgba(255, 30, 60, .35);
  }

  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px 24px;
    font-family: inherit;
    font-size: .8rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #ff2d4d, #c4002a);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 30, 60, .55);
    transition: transform .2s, opacity .2s;
  }
  button:hover  { transform: scale(1.02); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: default; transform: none; }

  .status {
    min-height: 1.4em;
    margin: 14px 0 0;
    font-size: .9rem;
    text-align: center;
    color: #ff8fa3;
  }
  .status.err { color: #ff6b6b; }

  /* Tampilan setelah terkirim */
  .done { display: none; padding: 40px 24px; text-align: center; }
  .done .icon {
    font-size: 2.6rem;
    color: #ff2d4d;
    text-shadow: 0 0 18px rgba(255, 30, 60, .9);
    animation: beat 1.4s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  .done h2 {
    margin: 10px 0 8px;
    font-family: "Great Vibes", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: 2.8rem;
    letter-spacing: .02em;
    text-shadow: 0 0 12px rgba(255, 60, 90, .7);
  }
  .done p {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.7;
    color: #ffd6e0;
  }

  /* ===== Galeri foto kenangan ===== */
  .gallery {
    display: none;
    flex-direction: column;
    gap: 14px;
    margin-top: 18px;
  }
  .gallery.show { display: flex; }
  .gallery h3 {
    margin: 0;
    font-family: "Great Vibes", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: 2.6rem;
    text-shadow: 0 0 10px rgba(255, 60, 90, .8),
                 0 0 28px rgba(255, 30, 60, .5);
  }
  .gallery .sub {
    margin: 0 0 8px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: #ffd6e0;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px 14px;
  }
  .polaroid {
    width: calc(50% - 7px);
    margin: 0;
    padding: 8px 8px 12px;
    background: #fff0f3;
    border-radius: 4px;
    box-shadow: 0 0 18px rgba(255, 30, 60, .35),
                0 6px 16px rgba(0, 0, 0, .6);
    cursor: pointer;
    opacity: 0;
    transform: translateY(24px) rotate(var(--r, 0deg));
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  /* kalau hanya satu foto, tampil lebih besar di tengah */
  .grid .polaroid:only-child { width: min(78%, 300px); }
  .polaroid.in { opacity: 1; transform: rotate(var(--r, 0deg)); }
  .polaroid img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    background: #2a0a10;
  }
  .polaroid figcaption {
    margin-top: 8px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    line-height: 1.3;
    color: #5a1a2a;
  }

  /* Foto dibesarkan */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    background: rgba(0, 0, 0, .92);
    cursor: pointer;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 78vh;
    border: 8px solid #fff0f3;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(255, 30, 60, .5);
  }
  .lightbox p {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    color: #ffd6e0;
    text-align: center;
  }

  .back {
    align-self: center;
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #ff8fa3;
    text-decoration: none;
    opacity: .75;
  }
  .back:hover { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .hearts { display: none; }
    .done .icon { animation: none; }
    .polaroid { transition: none; }
  }
</style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main>
    <header>
      <p class="kicker">Giliranmu</p>
      <h1>Untuk Beta</h1>
    </header>

    <p class="intro">Tulis apa saja yang ingin kamu sampaikan. Jujur juga tidak apa-apa.</p>

    <form class="card" id="form">
      <!-- anti-spam, jangan dihapus -->
      <input type="checkbox" name="botcheck" id="botcheck" style="display:none" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" required placeholder="Tulis pesanmu untuk Beta di sini..."></textarea>
      </div>

      <div class="field">
        <label for="kesan">Kesan</label>
        <textarea id="kesan" name="kesan" required placeholder="Tulis kesanmu tentang Beta di sini..."></textarea>
      </div>

      <button type="submit" id="sendBtn">Kirim ♥</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <!-- Tampil setelah pesan terkirim -->
    <div class="card done" id="done">
      <div class="icon">♥</div>
      <h2>Terima kasih</h2>
      <p>Pesan dan kesanmu sudah terkirim. Beta pasti senang membacanya.</p>
    </div>

    <!-- ===== FOTO KENANGAN =====
         Foto ada di folder yang sama dengan file ini, jadi cukup tulis nama filenya.
         Untuk menambah foto: salin satu blok <figure> ... </figure>, lalu ganti
         nama file (src) dan keterangannya (figcaption). Variasikan angka --r
         supaya kemiringannya berbeda. -->
    <section class="gallery" id="gallery">
      <h3>Kenangan</h3>
      <p class="sub">Beberapa momen yang selalu aku ingat.</p>

      <div class="grid">
        <figure class="polaroid" style="--r:-3deg">
          <img src="beta.jpg" alt="Kenangan 1" loading="lazy">
          <figcaption>1</figcaption>
        </figure>
      </div>
    </section>

    <a class="back" href="beta.html">← Kembali</a>
  </main>

  <!-- Foto dibesarkan -->
  <div class="lightbox" id="lightbox">
    <img id="lbImg" alt="">
    <p id="lbCap"></p>
  </div>

<script>
  /* ===== PENGATURAN ===== */
  const ACCESS_KEY = "57309947-d41b-466f-8074-2dff60251fa5";
  const NAMA_PENGIRIM = "Rani";

  const form = document.getElementById("form");
  const btn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const doneBox = document.getElementById("done");
  const gallery = document.getElementById("gallery");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle("err", !!isError);
  }

  /* ===== Galeri: kalau foto gagal dimuat, tampilkan nama file yang bermasalah ===== */
  document.querySelectorAll(".polaroid img").forEach(img => {
    img.addEventListener("error", () => {
      img.closest(".polaroid").querySelector("figcaption").textContent =
        "Foto tidak ditemukan: " + img.getAttribute("src");
      img.style.display = "none";
    });
  });

  function showGallery() {
    gallery.classList.add("show");

    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll(".polaroid").forEach((el, i) => {
      el.style.transitionDelay = ((i % 2) * 0.15) + "s";
      io.observe(el);
    });
  }

  /* ===== Foto dibesarkan ===== */
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCap");

  document.querySelectorAll(".polaroid").forEach(fig => {
    fig.addEventListener("click", () => {
      const img = fig.querySelector("img");
      if (img.style.display === "none") return; // foto gagal dimuat, tidak dibesarkan
      lbImg.src = img.src;
      lbCap.textContent = fig.querySelector("figcaption").textContent;
      lightbox.classList.add("show");
    });
  });
  lightbox.addEventListener("click", () => lightbox.classList.remove("show"));

  /* ===== Kirim pesan ===== */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // jika bot mengisi kotak tersembunyi, abaikan
    if (document.getElementById("botcheck").checked) return;

    const pesan = document.getElementById("pesan").value.trim();
    const kesan = document.getElementById("kesan").value.trim();
    if (!pesan || !kesan) {
      setStatus("Pesan dan kesan sama-sama diisi dulu ya.", true);
      return;
    }

    btn.disabled = true;
    setStatus("Mengirim...", false);

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          access_key: ACCESS_KEY,
          subject: "Pesan dan kesan dari " + NAMA_PENGIRIM,
          from_name: NAMA_PENGIRIM,
          name: NAMA_PENGIRIM,
          message: "PESAN:\n" + pesan + "\n\nKESAN:\n" + kesan
        })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        form.style.display = "none";
        doneBox.style.display = "block";
        showGallery();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        setStatus("Gagal mengirim. Coba lagi sebentar.", true);
        btn.disabled = false;
      }
    } catch (err) {
      setStatus("Tidak ada koneksi. Coba lagi ya.", true);
      btn.disabled = false;
    }
  });

  /* Hati kecil melayang di latar */
  const box = document.getElementById("hearts");
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (10 + Math.random() * 16) + "px";
    s.style.animationDuration = (9 + Math.random() * 9) + "s";
    s.style.animationDelay = (Math.random() * 10) + "s";
    box.appendChild(s);
  }
</script>
</body>
</html>
